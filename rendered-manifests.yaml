# Source: two-tier-flask-app/templates/mysql-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-two-tier-flask-app-mysql
  labels:
    helm.sh/chart: two-tier-flask-app-0.1.0
    app.kubernetes.io/name: two-tier-flask-app
    app.kubernetes.io/instance: app
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: two-tier-flask-app
    app.kubernetes.io/component: database
spec:
  serviceName: app-two-tier-flask-app-mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: two-tier-flask-app
      app.kubernetes.io/instance: app
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: two-tier-flask-app
        app.kubernetes.io/instance: app
        app.kubernetes.io/component: database
      annotations:
        checksum/initdb: 09b80d8981e2ab7b
    spec:
      serviceAccountName: app-two-tier-flask-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: "mysql:8.4"
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-two-tier-flask-app-mysql
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: "devops"
            - name: MYSQL_USER
              value: "admin"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-two-tier-flask-app-mysql
                  key: mysql-password
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          # TCP to 127.0.0.1 fails while the entrypoint's temporary init server runs
          # (it uses --skip-networking), so the pod is only Ready once real mysqld is up.
          startupProbe:
            exec:
              command: ["sh","-c","MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh","-c","MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh","-c","MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: app-two-tier-flask-app-mysql-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: two-tier-flask-app
          app.kubernetes.io/instance: app
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
