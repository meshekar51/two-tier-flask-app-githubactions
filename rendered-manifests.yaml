# Source: two-tier-flask-app/templates/flask-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-two-tier-flask-app
  labels:
    helm.sh/chart: two-tier-flask-app-0.1.0
    app.kubernetes.io/name: two-tier-flask-app
    app.kubernetes.io/instance: app
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: two-tier-flask-app
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: two-tier-flask-app
      app.kubernetes.io/instance: app
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: two-tier-flask-app
        app.kubernetes.io/instance: app
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: app-two-tier-flask-app
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: "trainwithshubham/two-tier-flask-app:latest"
          imagePullPolicy: IfNotPresent
          # Reuses the app image (it already has Python), so no extra image to pull or scan.
          command:
            - python
            - -c
            - |
              import os, socket, time
              host, port = os.environ["MYSQL_HOST"], int(os.environ["MYSQL_PORT"])
              while True:
                  try:
                      socket.create_connection((host, port), timeout=2).close()
                      print(f"{host}:{port} is accepting connections", flush=True)
                      break
                  except OSError as err:
                      print(f"waiting for {host}:{port} ({err})", flush=True)
                      time.sleep(3)
          env:
            - name: MYSQL_HOST
              value: "app-two-tier-flask-app-mysql"
            - name: MYSQL_PORT
              value: "3306"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: flask
          image: "trainwithshubham/two-tier-flask-app:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: MYSQL_HOST
              value: "app-two-tier-flask-app-mysql"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: "admin"
            - name: MYSQL_DB
              value: "devops"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-two-tier-flask-app-mysql
                  key: mysql-password
            # Root filesystem is read-only: keep gunicorn's control socket and Python bytecode off it.
            - name: XDG_RUNTIME_DIR
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
