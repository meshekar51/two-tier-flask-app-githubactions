# Source: two-tier-flask-app/templates/tests/test-smoke.yaml
apiVersion: v1
kind: Pod
metadata:
  name: app-two-tier-flask-app-smoke-test
  labels:
    helm.sh/chart: two-tier-flask-app-0.1.0
    app.kubernetes.io/name: two-tier-flask-app
    app.kubernetes.io/instance: app
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: two-tier-flask-app
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    fsGroup: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke-test
      image: "trainwithshubham/two-tier-flask-app:latest"
      imagePullPolicy: IfNotPresent
      env:
        - name: BASE_URL
          value: "http://app-two-tier-flask-app:80"
        - name: WRITE_CHECK
          value: "false"
      command:
        - python
        - -c
        - |
          import os, sys, time, urllib.error, urllib.parse, urllib.request

          base = os.environ["BASE_URL"]

          def call(path, data=None, attempts=5):
              for i in range(1, attempts + 1):
                  try:
                      with urllib.request.urlopen(base + path, data=data, timeout=10) as r:
                          return r.status, r.read().decode()
                  except (urllib.error.URLError, OSError) as err:
                      print(f"  attempt {i}/{attempts} {path}: {err}", flush=True)
                      time.sleep(3)
              return None, ""

          def check(name, ok):
              print(("PASS  " if ok else "FAIL  ") + name, flush=True)
              if not ok:
                  sys.exit(1)

          status, _ = call("/health")
          check("GET /health returns 200", status == 200)

          status, _ = call("/")
          check("GET / returns 200 (reads messages from MySQL)", status == 200)

          if os.environ.get("WRITE_CHECK") == "true":
              msg = f"helm-test-{int(time.time())}"
              status, _ = call("/submit", data=urllib.parse.urlencode({"new_message": msg}).encode(), attempts=1)
              check("POST /submit returns 200 (writes to MySQL)", status == 200)
              status, body = call("/")
              check("submitted message is read back from MySQL", msg in body)

          print("all smoke tests passed", flush=True)
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
