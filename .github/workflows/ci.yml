name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  HELM_VERSION: "v4.3.0"
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  KUBE_VERSION: "1.35.0"
  CHART_DIR: helm/two-tier-flask-app
  IMAGE_NAME: two-tier-flask-app
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/two-tier-flask-app
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  sast:
    name: SAST / Lint / Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit safety yamllint

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Bandit security scan
        run: |
          bandit -r . -f json -o bandit-report.json || true
          test -s bandit-report.json

      - name: Safety dependency scan
        run: |
          safety check --full-report || true

      - name: YAML lint
        run: yamllint -d relaxed .github/workflows helm

      - name: Dockerfile lint
        run: |
          docker run --rm -i hadolint/hadolint:latest < Dockerfile

      - name: Upload SAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
          if-no-files-found: ignore
          retention-days: 14

  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --cov=app --cov-report=xml --cov-report=term

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  trivy-fs:
    name: Trivy FS + secrets + config scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload Trivy filesystem scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  helm-lint:
    name: Helm lint + manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tgz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C /usr/local/bin kubeconform

      - name: Lint and validate chart
        run: |
          set -euo pipefail
          for values in "" values-kubeadm.yaml values-eks.yaml values-ci.yaml; do
            args=()
            if [[ -n "$values" ]]; then args=(-f "$CHART_DIR/$values"); fi
            echo "::group::${values:-values.yaml (defaults)}"
            helm lint --strict "$CHART_DIR" "${args[@]}"
            helm template ci "$CHART_DIR" --namespace ci "${args[@]}" \
              | kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION"
            echo "::endgroup::"
          done

  docker-build:
    name: Docker build and sign
    needs: [sast, unit-tests, trivy-fs, helm-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=sha,format=short
            type=raw,value=ci-latest

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:ci-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image is non-root
        run: |
          IMAGE="${{ env.IMAGE_REPO }}:${{ github.sha }}"
          USER=$(docker image inspect --format '{{.Config.User}}' "$IMAGE")
          echo "Image USER=$USER"
          if ! [[ "$USER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Image must set a numeric non-root USER."
            exit 1
          fi

      - name: Sign image with Cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "${{ env.IMAGE_REPO }}:${{ github.sha }}"

  image-scan:
    name: Trivy image scan
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: sarif
          output: trivy-image-results.sarif

      - name: Upload Trivy image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  update-helm-tag:
    name: Update Helm image tag in values file
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Update image.repository and image.tag in Helm values
        env:
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          VALUES_FILE="${{ env.CHART_DIR }}/values-ci.yaml"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "::error::Helm values file not found: $VALUES_FILE"
            exit 1
          fi

          python - <<'PY'
import os
from pathlib import Path

values_file = Path(os.environ["VALUES_FILE"])
repo = os.environ["IMAGE_REPO"]
tag = os.environ["IMAGE_TAG"]

text = values_file.read_text()

# Replace image.repository
text = text.replace(
    "repository: .*",
    f"repository: {repo}",
    1
) if "repository: .*" in text else text

# Replace image.tag
text = text.replace(
    "tag: .*",
    f"tag: {tag}",
    1
) if "tag: .*" in text else text

# Handle YAML block style if present
if "repository:" in text and "tag:" in text:
    pass

values_file.write_text(text)
print(f"Updated {values_file}")
print(f"repository={repo}")
print(f"tag={tag}")
PY

          echo "---- Updated helm values ----"
          sed -n '1,120p' "$VALUES_FILE"

      - name: Validate helm template renders with updated tag
        run: |
          helm template ci "${{ env.CHART_DIR }}" \
            -f "${{ env.CHART_DIR }}/values-ci.yaml" > /tmp/rendered.yaml
          grep -n "image:" /tmp/rendered.yaml | head

      - name: Commit updated Helm values
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ env.CHART_DIR }}/values-ci.yaml"
          git diff --cached --quiet || git commit -m "ci: update Helm image tag"
          git push

  ci-complete:
    name: CI gate summary
    needs: [sast, unit-tests, trivy-fs, helm-lint, docker-build, image-scan, update-helm-tag]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Final status
        run: |
          for job in sast unit-tests trivy-fs helm-lint docker-build image-scan update-helm-tag; do
            val="${{ needs[job].result }}"
            echo "$job=$val"
            if [ "$val" = "failure" ] || [ "$val" = "cancelled" ]; then
              echo "::error::$job failed"
              exit 1
            fi
          done
          echo "All CI checks passed."
