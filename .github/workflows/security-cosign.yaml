name: Security - Cosign Image Signing

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      image-ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image-ref:
        required: true
        default: "meshekar51/flask-app:latest"

jobs:
  sign-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.6.0"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign image with Cosign (Private/Public Key)
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_KEY --yes "${{ inputs.image-ref }}"

      - name: Verify image signature
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          cosign verify --key env://COSIGN_PUBLIC_KEY "${{ inputs.image-ref }}"
