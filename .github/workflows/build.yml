name: Build

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version for tests
        required: false
        default: "3.11"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:${{ github.run_number }}

      - name: Update Helm values with new image tag
        shell: bash
        run: |
          set -e

          sed -i "s/^  tag:.*/  tag: ${{ github.run_number }}/" helm/two-tier-flask-app/values-ci.yaml

          git config --local user.email "meshekar5@gmail.com"
          git config --local user.name "meshekar51"

          if git diff --quiet -- helm/two-tier-flask-app/values-ci.yaml; then
            echo "No Helm values change required."
          else
            git add helm/two-tier-flask-app/values-ci.yaml
            git commit -m "Update image tag to ${{ github.run_number }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

  security:
    name: Run security checks
    needs: build
    uses: ./.github/workflows/security-orchestrator.yml
    secrets: inherit

  sign:
    name: Sign container image
    needs: security
    uses: ./.github/workflows/security-cosign.yaml
    with:
      image-ref: ${{ vars.DOCKERHUB_USERNAME }}/flask-app:${{ github.run_number }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
