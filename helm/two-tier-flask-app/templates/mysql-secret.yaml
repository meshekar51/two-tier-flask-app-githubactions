{{- if not .Values.mysql.auth.existingSecret }}
{{- $name := include "twotier.mysql.fullname" . }}
{{- /* Reuse passwords already in the cluster so upgrades never rotate them
       (MySQL keeps the password from first boot on its data volume). */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $password := .Values.mysql.auth.password }}
{{- if not $password }}{{- $password = get $data "mysql-password" | b64dec }}{{- end }}
{{- if not $password }}{{- $password = randAlphaNum 24 }}{{- end }}
{{- $rootPassword := .Values.mysql.auth.rootPassword }}
{{- if not $rootPassword }}{{- $rootPassword = get $data "mysql-root-password" | b64dec }}{{- end }}
{{- if not $rootPassword }}{{- $rootPassword = randAlphaNum 24 }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "twotier.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    # The MySQL PVC outlives `helm uninstall`; keep its credentials with it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  mysql-password: {{ $password | b64enc | quote }}
  {{- if .Values.mysql.enabled }}
  mysql-root-password: {{ $rootPassword | b64enc | quote }}
  {{- end }}
{{- end }}
