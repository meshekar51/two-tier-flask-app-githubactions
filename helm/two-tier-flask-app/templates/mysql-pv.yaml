{{- if and .Values.mysql.enabled .Values.mysql.persistence.enabled .Values.mysql.persistence.hostPath.enabled }}
# Static hostPath PV for clusters without a dynamic provisioner (kubeadm).
# Pre-bound via claimRef to the PVC the StatefulSet creates (data-<sts>-0).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ printf "%s-%s-data" .Release.Namespace (include "twotier.mysql.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "twotier.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ .Values.mysql.persistence.size }}
  volumeMode: Filesystem
  accessModes:
    - {{ .Values.mysql.persistence.accessMode }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.mysql.persistence.storageClass | quote }}
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: data-{{ include "twotier.mysql.fullname" . }}-0
  hostPath:
    path: {{ .Values.mysql.persistence.hostPath.path }}
    type: DirectoryOrCreate
{{- end }}
