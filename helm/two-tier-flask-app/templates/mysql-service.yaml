{{- if .Values.mysql.enabled }}
# ClusterIP Service the web tier connects to (MYSQL_HOST).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "twotier.mysql.fullname" . }}
  labels:
    {{- include "twotier.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: {{ .Values.mysql.service.port }}
      targetPort: mysql
      protocol: TCP
  selector:
    {{- include "twotier.mysql.selectorLabels" . | nindent 4 }}
---
# Headless governing Service required by the StatefulSet (stable pod DNS).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "twotier.mysql.fullname" . }}-headless
  labels:
    {{- include "twotier.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: mysql
      port: {{ .Values.mysql.service.port }}
      targetPort: mysql
      protocol: TCP
  selector:
    {{- include "twotier.mysql.selectorLabels" . | nindent 4 }}
{{- end }}
