{{- if and .Values.networkPolicy.enabled .Values.mysql.enabled }}
# Only the Flask pods may reach MySQL on 3306.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "twotier.mysql.fullname" . }}
  labels:
    {{- include "twotier.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      {{- include "twotier.mysql.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "twotier.flask.selectorLabels" . | nindent 14 }}
      ports:
        - port: mysql
          protocol: TCP
{{- end }}
