# SonarCloud project metadata
sonar.projectKey=meshekar51_two-tier-flask-app-githubactions
sonar.organization=meshekar51
sonar.projectName=two-tier-flask-app-githubactions

# Source code
sonar.sources=.
sonar.language=py

# Python version
sonar.python.version=3

# Optional: ignore virtualenv/cache files
sonar.exclusions=**/venv/**,**/__pycache__/**,**/.pytest_cache/**,**/.mypy_cache/**,**/.github/**,**/*.db

# Test config (if you have pytest)
sonar.tests=tests
sonar.test.inclusions=**/test*.py

# Coverage report generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml
